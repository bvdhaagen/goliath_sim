# Velocity limits mirror the URDF (2.5 rad/s). Acceleration limits are added so
# MoveIt can time-parameterize trajectories (the URDF has no accel limits).
default_velocity_scaling_factor: 0.3
default_acceleration_scaling_factor: 0.3

joint_limits:
  joint_1:
    has_velocity_limits: true
    max_velocity: 2.5
    has_acceleration_limits: true
    max_acceleration: 5.0
  joint_2:
    has_velocity_limits: true
    max_velocity: 2.5
    has_acceleration_limits: true
    max_acceleration: 5.0
