# Bridge from MoveIt to the existing ros2_control JointTrajectoryController.
# MoveIt sends plans to arm_controller/follow_joint_trajectory -> Gazebo arm moves.
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm_controller

  arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
